<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Art Memory Quiz App</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <div class="quiz-container">
        <h1>Art Name Quiz</h1>
        <div id="quiz">
            <img id="art-image" src="Images/" alt="Art Piece">
            <p id="question text">What is the name of this artwork and artist?</p>

            <input type="text" id="art-user-input" placeholder="Enter art name here...">
            <br>
            <input type="text" id="artist-user-input" placeholder="Enter the artist's name here...">
            <button onclick="checkAnswer()">Submit</button>

            <p id="result-message"></p>
            <button id="next-btn" onclick="nextQuestion()" style="display:none;">Next</button>
        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>
