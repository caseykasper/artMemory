<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Memory Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <a class="skip-link" href="#quiz">Skip to the quiz</a>

    <div class="quiz-container">
        <header>
            <h1>Art Memory Quiz</h1>
            <p class="scoreboard">
                <span>Score: <strong id="score">0</strong></span>
                <span>Streak: <strong id="streak">0</strong></span>
            </p>
            <p class="progress-label" id="progress-label">Artwork 1 of 1</p>
            <progress id="progress" value="0" max="1" aria-labelledby="progress-label"></progress>
        </header>

        <main id="quiz" tabindex="-1">
            <section id="question-section" aria-labelledby="question-heading">
                <h2 id="question-heading">Can you name this artwork and its artist?</h2>

                <figure class="frame">
                    <img id="art-image" src="" alt="">
                    <p id="image-error" hidden>This picture did not load. Ask your teacher for help.</p>
                    <figcaption id="placard" hidden></figcaption>
                </figure>

                <form id="answer-form" novalidate>
                    <label for="art-user-input">Name of the artwork</label>
                    <input type="text" id="art-user-input" autocomplete="off" autocapitalize="off" spellcheck="false">

                    <label for="artist-user-input">Name of the artist</label>
                    <input type="text" id="artist-user-input" autocomplete="off" autocapitalize="off"
                        spellcheck="false">
                    <p class="tip">Tip: Last name only is fine for the artist.</p>

                    <div class="actions">
                        <button type="submit" id="submit-btn" class="primary">Check my answers</button>
                        <button type="button" id="hint-btn" class="secondary">Give me a hint</button>
                    </div>
                </form>

                <div id="hint-text" class="hint" aria-live="polite"></div>

                <div id="result-message" class="feedback" tabindex="-1" hidden></div>

                <button type="button" id="next-btn" class="primary" hidden>Next artwork</button>
            </section>

            <section id="results-section" aria-labelledby="results-heading" hidden>
                <h2 id="results-heading" tabindex="-1">Quiz complete!</h2>
                <p id="final-score"></p>
                <button type="button" id="restart-btn" class="primary">Play again</button>
            </section>
        </main>
    </div>

    <script src="main.js"></script>
</body>

</html>
